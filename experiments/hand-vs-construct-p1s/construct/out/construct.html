      ui: q.get("ui") !== "0", labels: q.get("labels") === "1", caption: q.get("caption") !== "0", text: q.get("text") !== "0",
      sheet: q.get("sheet"), fps: q.has("fps") ? parseInt(q.get("fps"), 10) : 30, capture: q.get("capture") === "1",
      open: q.has("open") ? Math.max(0, Math.min(1, parseFloat(q.get("open")) || 0)) : null,
      shift: q.has("shift") ? q.get("shift").split(",").map((x) => Math.max(-0.9, Math.min(0.9, parseFloat(x) || 0))).concat([0]).slice(0, 2) : null,

      palette: q.get("palette"), identity: q.get("identity"),

      freezeCamera: q.get("camera") === "still",

    const stage = document.getElementById("stage");
    const canvas = document.getElementById("holo");
    const overlay = document.getElementById("overlay");
    let holo;
    try { holo = new Hologram(canvas, geo, opt); }
    catch (err) { document.body.setAttribute("data-error", String(err.message || err)); overlay.appendChild(el("pre", "error", String(err.message || err))); window.HOLO = { ready: Promise.reject(err) }; return; }
    holo.dpr = Math.min(2, window.devicePixelRatio || 1);
    const resize = () => {
      const r = stage.getBoundingClientRect();
      canvas.width = Math.max(1, Math.round(r.width * holo.dpr)); canvas.height = Math.max(1, Math.round(r.height * holo.dpr));
    };
    resize();

    // caption: what this is and how much of it is evidence (never implies exact accuracy)
    const subj = geo.subject;
    const accuracy = { generic: "GENERIC RECONSTRUCTION", approximate: "APPROXIMATE RECONSTRUCTION", documented: "DOCUMENTED RECONSTRUCTION",
      original: "ORIGINAL DESIGN", recorded: "RECORDED RUN" }[subj.accuracy];
    const caption = el("div", "caption");
    caption.appendChild(el("div", "title", geo.title));
    caption.appendChild(el("div", "meta", [accuracy, subj.synthetic ? "SYNTHETIC EXAMPLE" : null, geo.counts.lines + " LINES"].filter(Boolean).join(" · ")));
    if ((geo.provenance.assets || []).some((a) => a.provenance === "generated-decorative")) caption.appendChild(el("div", "meta warn", "ARTWORK: GENERATED DECORATION, NOT AUTHENTIC"));
    // terrain says how its relief is known, at what scale, and whose data it is
    const relief = geo.parts.find((p) => p.shape === "terrain");
    if (relief) {
      const measured = relief.certainty === "verified" || relief.certainty === "user_supplied";
      const fact = (k) => ((geo.provenance.facts || []).find((f) => f.key === k) || {}).value;
      const ex = fact("terrain.vertical_exaggeration");
      caption.appendChild(el("div", "meta", [measured ? "MEASURED TERRAIN" : "SKETCHED TERRAIN", fact("terrain.scale"),
        ex && ex !== 1 ? "HEIGHTS ×" + ex : null].filter(Boolean).join(" · ")));
      (geo.provenance.sources || []).filter((s) => s.kind === "dataset").forEach((s) => caption.appendChild(el("div", "meta", "DATA: " + s.title)));
    }
    // a globe says the same of its coastlines
    const coast = !relief && geo.parts.find((p) => p.shape === "globe" && p.role === "identity");
    if (coast) {
      const measured = coast.certainty === "verified" || coast.certainty === "user_supplied";
      const scale = ((geo.provenance.facts || []).find((f) => f.key === "globe.scale") || {}).value;
      caption.appendChild(el("div", "meta", [measured ? "MEASURED COASTLINES" : "SKETCHED COASTLINES", scale].filter(Boolean).join(" · ")));
      (geo.provenance.sources || []).filter((s) => s.kind === "dataset").forEach((s) => caption.appendChild(el("div", "meta", "DATA: " + s.title)));
    }
    // a note on how this construct records its evidence (an older construct, say), in the provenance view only
    const provNote = ((geo.provenance || {}).authoring || {}).provenance_note;
    if (provNote) caption.appendChild(el("div", "provnote", provNote));
    if (!opt.caption || opt.sheet) caption.style.display = "none";
    overlay.appendChild(caption);
    // provenance legend: each kind of evidence the construct has, how many parts, and what the verified ones cite
    const legend = el("div", "legend");
    const sourceOf = {}, factOf = {};
    (geo.provenance.sources || []).forEach((s) => { sourceOf[s.id] = s; });
    (geo.provenance.facts || []).forEach((f) => { factOf[f.key] = f; });
    const cited = (p, axis) => {   // the sources behind a verified axis: a size its verified facts' sources, a shape its own
      const facts = axis === "size" ? (p.basis || []).map((k) => factOf[k]).filter((f) => f && f.certainty === "verified" && f.source) : [];
      return facts.length ? facts.map((f) => f.source) : p.source ? [p.source] : [];
    };
    const kinds = [["verified", "VERIFIED", ["size", "shape"]], ["size_verified", "SIZE VERIFIED", ["size"]],
      ["shape_verified", "SHAPE VERIFIED", ["shape"]], ["traced", "TRACED", null], ["user_supplied", "USER-SUPPLIED", null],
      ["inferred", "INFERRED", null], ["decorative", "DECORATIVE", null]];
    kinds.forEach(([k, label, axes]) => {
      const parts = geo.parts.filter((p) => provClass(p) === k);
      if (!parts.length) return;
      const row = el("div", "row " + k), sw = el("span", "swatch"), text = el("span", "", label + " · " + parts.length);
      row.appendChild(sw); row.appendChild(text);
      legend.appendChild(row);
      // the shades: deepest first, each with its count; one shade alone is said on the row itself
      const shades = SHADES[k] ? SHADES[k].map((_, i) => SHADES[k].length - i).filter((l) => parts.some((p) => p.evidence === l)) : [];
      const shade = (l) => rgbCss(CERT_RGB[CERT_CODE[k + "-" + l]]);
      const checkedBy = (l) => {   // the comparisons that passed, for the deepest shade
        if (l !== SHADES[k].length) return;
        const refs = new Set(parts.filter((p) => p.evidence === l).map((p) => p.source));
        (geo.provenance.checked || []).filter((c) => refs.has(c.reference) && sourceOf[c.reference]).forEach((c) => {
          const src = el("div", "src", Math.round(c.iou * 100) + "% · " + sourceOf[c.reference].title);
          src.title = sourceOf[c.reference].title;
          legend.appendChild(src);
        });
      };
      // designed parts made to a requirement (the user's, or the documentation's) apart from those designed freely,
      // with the sources of those requirements
      const wanted = (p) => (p.basis || []).filter((b) => factOf[b] && factOf[b].requirement);
      const toReq = k === "inferred" ? parts.filter((p) => p.evidence === 1 && wanted(p).length) : [];
      const designed = (l) => {
        if (l !== 1 || !toReq.length) return;
        [["DESIGNED · TO A REQUIREMENT", toReq.length], ["DESIGNED", parts.filter((p) => p.evidence === 1).length - toReq.length]]
          .forEach(([name, n]) => {
            if (!n) return;
            const sub = el("div", "row sub"), s2 = el("span", "swatch");
            s2.style.background = shade(1);
            sub.appendChild(s2); sub.appendChild(el("span", "", name + " · " + n));
            legend.appendChild(sub);
            if (name !== "DESIGNED") {
              const ids = [...new Set(toReq.flatMap((p) => wanted(p).map((b) => factOf[b].source)))].filter((id) => sourceOf[id]);
              ids.slice(0, 3).forEach((id) => {
                const src = el("div", "src", sourceOf[id].title);
                src.title = sourceOf[id].title;
                legend.appendChild(src);
              });
              if (ids.length > 3) legend.appendChild(el("div", "src more", "+" + (ids.length - 3) + " MORE"));
            }
          });
      };
      if (shades.length === 1) {
        sw.style.background = shade(shades[0]);
        text.textContent = label + " · " + SHADES[k][shades[0] - 1] + " · " + parts.length;
        checkedBy(shades[0]);
        designed(shades[0]);
      } else if (shades.length > 1) {
        sw.style.background = "linear-gradient(90deg," + shades.slice().reverse().map(shade).join(",") + ")";
        shades.forEach((l) => {
          const sub = el("div", "row sub"), s2 = el("span", "swatch");
          s2.style.background = shade(l);
          sub.appendChild(s2); sub.appendChild(el("span", "", SHADES[k][l - 1] + " · " + parts.filter((p) => p.evidence === l).length));

        });
      }
      if (!axes) return;
      const ids = [...new Set(parts.flatMap((p) => axes.flatMap((ax) => cited(p, ax))))].filter((id) => sourceOf[id]);
      ids.slice(0, 3).forEach((id) => {
        const src = el("div", "src", sourceOf[id].title);
        src.title = sourceOf[id].title;
        legend.appendChild(src);
      });
      if (ids.length > 3) legend.appendChild(el("div", "src more", "+" + (ids.length - 3) + " MORE"));
    });
    overlay.appendChild(legend);
    const help = el("div", "help", "drag orbit · wheel zoom · 1–6 views · R replay · M motion · P provenance" +
      (holo.solid ? " · S solid" : "") + " · L labels" + (holo.art.length ? " · T text" : "") + " · space pause");
    overlay.appendChild(help);
    const labels = el("div", "labels"); overlay.appendChild(labels);
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("class", "leaders"); overlay.appendChild(svg);
    const sheetCaps = el("div", "sheetcaps"); overlay.appendChild(sheetCaps);
    const setUi = () => {
      document.body.classList.toggle("noui", !opt.ui);
      // the legend says what the colours mean, so it shows wherever P does (an embedded page too); not in a still
      legend.style.display = opt.mode === "provenance" && (opt.ui || !opt.capture) ? "block" : "none";
      document.body.classList.toggle("provenance", opt.mode === "provenance");
      document.body.classList.toggle("solid", !!(opt.solid && holo.solid));
      help.style.display = opt.ui && !opt.capture ? "block" : "none";
    };
    setUi();

    let clock0 = performance.now(), paused = false, pausedAt = 0, frozen = opt.t;
    const now = () => frozen !== null ? frozen : paused ? pausedAt : (performance.now() - clock0) / 1000;

    function placeLabels(vp, rect, t) {
      labels.textContent = ""; svg.textContent = "";
      if (!opt.labels || opt.sheet) return;
      // a label waits for its part: shown once the build has reached the point it names, never over an empty frame
      const at = holo.assemblyTimes(), st = holo.state(t), begun = t >= at.ghost + at.collapse;
      const cw = canvas.width / holo.dpr, ch = canvas.height / holo.dpr;
      svg.setAttribute("viewBox", "0 0 " + cw + " " + ch);
      const placed = [];
      const free = (x, y, w) => !placed.some((r) => x < r[0] + r[2] + 8 && x + w + 8 > r[0] && Math.abs(y - r[1]) < 22);
      (geo.annotations || []).forEach((a, i) => {
        const shown = !begun ? 0 : a.phase === undefined ? 1 : Math.max(0, Math.min(1, (st.build - a.phase) / 0.03));

        const c = project(vp, holo.C), right = !c || sx >= (c[0] * 0.5 + 0.5) * cw;
        const w = 9 + 6.6 * a.text.length;

        line.setAttribute("points", sx + "," + sy + " " + lx + "," + ly);
        line.style.opacity = shown;
        svg.appendChild(line);
        const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        dot.setAttribute("cx", sx); dot.setAttribute("cy", sy); dot.setAttribute("r", 2.2); dot.style.opacity = shown;
        svg.appendChild(dot);
        const tag = el("div", "label " + a.certainty, a.text);
        tag.style.left = lx + "px"; tag.style.top = ly + "px"; tag.style.opacity = shown;
        if (!right) tag.classList.add("left");
        labels.appendChild(tag);
      });
    }

    function sheetCells(kind) {
      const at = holo.assemblyTimes(), first = holo.schedule[0];
      const end = at.end;
      if (kind === "views") return ["hero", "front", "side", "back", "top", "three-quarter"].map((v) => ({ label: v.toUpperCase(), t: end + 0.01, view: v, reduced: true }));
      if (kind === "assembly") {
        const ts = end > 0 ? [0.05, 0.4, 0.75].map((k) => k * at.ghost).concat([0.1, 0.25, 0.45, 0.65, 0.85].map((k) => at.ghost + at.collapse + k * at.build)).concat([at.ghost + at.collapse + at.build + 0.2, end + 0.3]) : [0];
        return ts.slice(at.ghost ? 0 : 3).map((t) => ({ label: "T " + t.toFixed(2) + " S", t, view: "hero", freezeCamera: true }));
      }
      if (kind === "life") {
        const evs = holo.schedule.slice(0, 6);
        return evs.length ? evs.map((e) => ({ label: e.kind.toUpperCase() + " " + (e.t0 + e.dur * 0.45).toFixed(1) + " S", t: e.t0 + e.dur * 0.45, view: "hero", freezeCamera: true }))
                          : [{ label: "LIFE OFF", t: end + 1, view: "hero" }];
      }
      if (kind === "motion") { const op = holo.openTimes(), span = Math.max(7.5, op.end - end + 1.5);
        return [0, 0.2, 0.4, 0.6, 0.8, 1].map((k) => ({ label: "MOTION " + (end + k * span).toFixed(1) + " S", t: end + k * span, view: "hero" })); }

      if (kind === "tour") return (geo.animation.camera.tour || []).map((s) => ({ label: "TOUR " + s.view.toUpperCase() + " " + (s.at + (s.fly || 2.2)).toFixed(1) + " S", t: s.at + (s.fly || 2.2) + 0.05, view: "hero" }));

    }

    function renderSheet(kind) {
      const cells = kind === "all" ? [].concat(sheetCells("assembly").slice(0, 4), sheetCells("views").slice(0, 4), sheetCells("life").slice(0, 2), sheetCells("provenance").slice(0, 2)) : sheetCells(kind);
      const n = cells.length, cols = n <= 4 ? 2 : 3, rows = Math.ceil(n / cols);

        cap.style.left = (col * cw / holo.dpr + 10) + "px"; cap.style.top = (row * chh / holo.dpr + 8) + "px";

      holo.opt.freezeCamera = held;
      const head = el("div", "sheethead", geo.title + " — " + kind.toUpperCase() + " · " + accuracy + (subj.synthetic ? " · SYNTHETIC" : ""));

    }

    function frame() {
      const t = now();
      if (opt.sheet) { renderSheet(opt.sheet); return; }
      const out = holo.draw(t, [0, 0, canvas.width, canvas.height], opt.view, {});
      placeLabels(out.vp, out.rect, t);
    }

    // interaction
    let drag = null, lastInput = -1e9;
    canvas.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY }; try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* a pen or touch already gone: drag without capture */ }

    canvas.addEventListener("pointermove", (e) => {

      else if (e.key === "r" || e.key === "R") { clock0 = performance.now(); frozen = null; paused = false; holo.userCamera = null; }
      else if (e.key === "m" || e.key === "M") { opt.reduced = !opt.reduced; holo.opt.reduced = opt.reduced; holo.schedule = holo.buildSchedule(); }

    let raf = 0, lastFrame = 0, running = false;

    }

    document.addEventListener("visibilitychange", () => { if (!document.hidden) kick(); });

    const artLoads = holo.art.map((a) => a.loading).filter(Boolean);
    const ready = Promise.all(artLoads).then(() => { frame(); kick(); document.body.setAttribute("data-ready", "1"); });
    window.HOLO = {
      ready, hologram: holo,
      renderAt(t, o) { o = o || {}; frozen = t; if (o.view) { opt.view = o.view; holo.userCamera = null; } if (o.mode) { opt.mode = o.mode; holo.opt.mode = o.mode; setUi(); }
        if (o.reduced !== undefined) { opt.reduced = o.reduced; holo.opt.reduced = o.reduced; holo.schedule = holo.buildSchedule(); }
        if (o.sheet !== undefined) opt.sheet = o.sheet;
        if (o.open !== undefined) { opt.open = o.open; holo.opt.open = o.open; }

      camera() { const c = holo.lastCamera; return c ? { target: c.target, yaw: c.yaw, pitch: c.pitch, dist: c.dist } : null; },
      project(p) { const c = holo.lastVP && project(holo.lastVP, p); const r = canvas.getBoundingClientRect();
        return c ? [(c[0] * 0.5 + 0.5) * r.width, (0.5 - c[1] * 0.5) * r.height] : null; },
      fitted(view) { const c = holo.cameraFor(view || "hero"); return { target: c.target, yaw: c.yaw, pitch: c.pitch, dist: c.dist }; },
      timeline() { const op = holo.openTimes(); return { assembly: holo.assemblyTimes(), open: op, settled: Math.max(holo.assemblyTimes().end, op.end), events: holo.schedule.slice(0, 24) }; },
    };
  }

  window.HologramViewer = { Hologram, boot, PALETTES };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
<script>
  // the improvement rounds, when a run recorded them (`construct rounds`): one line per round
  // (?rounds=1 shows them even without the UI; ?rounds=0 never shows them, as in a public gallery)
  (function () {
    var g = window.HOLOGRAM_GEOMETRY || {}, a = (g.provenance || {}).authoring || {}, rs = a.rounds || [];
    if (!rs.length || /[?&]rounds=0\b/.test(location.search)) return;
    var forced = /[?&]rounds=1\b/.test(location.search), box = document.createElement("div");
    var best = rs.filter(function (r) { return r.result !== "reverted"; }).slice(-1)[0];
    box.className = "rounds" + (forced ? " forced" : "");
    var head = document.createElement("div"); head.className = "head";
    head.textContent = "ROUNDS · " + rs.length + " · BEST R" + (best ? best.round : "-");
    box.appendChild(head);
    rs.forEach(function (r) {
      var row = document.createElement("div"); row.className = "r" + (best && r.round === best.round ? " best" : "");
      var n = document.createElement("span"); n.className = "n"; n.textContent = "R" + r.round;
      var res = document.createElement("span"); res.className = r.result; res.textContent = r.result;
      var m = document.createElement("span"); m.textContent = (r.minutes != null ? r.minutes.toFixed(0) + " min" : "");
      var c = document.createElement("span"); c.textContent = (r.changes || []).join(" ");
      var s = document.createElement("span"); s.textContent = r.summary || ""; row.title = r.summary || "";
      [n, res, m, c, s].forEach(function (e) { row.appendChild(e); });
      box.appendChild(row);
    });
    document.getElementById("stage").appendChild(box);
  })();
</script>
